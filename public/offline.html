<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Beecos</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #facc15; color: #111; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      main { max-width: 22rem; background: #fff; border: 3px solid #111; border-radius: 12px; padding: 24px; box-shadow: 5px 5px 0 #111; }
      h1 { margin: 0 0 8px; font-size: 1.5rem; }
      button { margin-top: 16px; font: inherit; font-weight: 700; padding: 10px 18px; border: 3px solid #111; border-radius: 8px; background: #facc15; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem internet</h1>
      <p>O Beecos precisa de conexão para mostrar as conversas e publicações. Conecte-se e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
